# Branch protection: require only the `✅ Repo Quality Gate` job as the single required status check.
name: Repo Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: repo-quality-${{ github.ref }}
  cancel-in-progress: true

env:
  ACTIONLINT_VERSION: 1.7.3
  KUBECONFORM_VERSION: 0.6.7
  CONFTEST_VERSION: 0.57.0
  HELM_VERSION: v3.15.2

jobs:
  markdown-links:
    name: Markdown Links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check markdown links
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          fail: true
          args: >-
            --verbose
            --config .mlc-config.toml
            docs/**/*.md README.md GETTING_STARTED.md

  actionlint:
    name: Actionlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install actionlint
        run: |
          curl -sSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash | bash -s -- "${ACTIONLINT_VERSION}"
          chmod +x ./actionlint

      - name: Run actionlint
        run: ./actionlint -color

  yamllint:
    name: Yamllint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install yamllint
        run: pip install --disable-pip-version-check --no-cache-dir yamllint==1.35.1

      - name: Run yamllint
        run: yamllint -c .yamllint.yml .

  kubeconform:
    name: Kubeconform
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          curl -sSL -o /tmp/kubeconform.tar.gz "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp
          sudo mv /tmp/kubeconform /usr/local/bin/kubeconform
          kubeconform -v

      - name: Validate Kubernetes manifests
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find cd/kubernetes -type f \( -name "*.yml" -o -name "*.yaml" \) \
            | grep -Ev 'kustomization\.ya?ml$|_test\.ya?ml$' || true)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No Kubernetes manifests found under cd/kubernetes/."
            exit 0
          fi
          kubeconform \
            --strict \
            --kubernetes-version 1.29.0 \
            --ignore-missing-schemas \
            --summary \
            --output pretty \
            "${files[@]}"

  helm-lint:
    name: Helm Lint + Template
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Helm
        run: |
          curl -sSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" -o /tmp/helm.tar.gz
          tar -xzf /tmp/helm.tar.gz -C /tmp
          sudo mv /tmp/linux-amd64/helm /usr/local/bin/helm
          helm version --short

      - name: Install kubeconform
        run: |
          curl -sSL -o /tmp/kubeconform.tar.gz "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp
          sudo mv /tmp/kubeconform /usr/local/bin/kubeconform
          kubeconform -v

      - name: Lint and template all charts
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          charts=()
          for dir in cd/helm/*/; do
            if [ -f "${dir}Chart.yaml" ]; then
              charts+=("${dir}")
            fi
          done
          if [ "${#charts[@]}" -eq 0 ]; then
            echo "No charts found under cd/helm/."
            exit 0
          fi

          for chart in "${charts[@]}"; do
            chart_name="$(basename "${chart}")"
            echo "Linting ${chart_name}"
            helm lint "${chart}" --strict

            echo "Templating ${chart_name} and validating with kubeconform"
            helm template "${chart_name}" "${chart}" | kubeconform \
              --strict \
              --kubernetes-version 1.29.0 \
              --ignore-missing-schemas \
              --summary \
              --output pretty \
              -
          done

  terraform:
    name: Terraform (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - aws-eks
          - azure-aks
          - gcp-gke
          - aws-lambda
          - aws-ecs
          - azure-app-service
    defaults:
      run:
        working-directory: terraform/${{ matrix.module }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Terraform init (no backend)
        run: terraform init -backend=false

      - name: Terraform fmt (check)
        run: terraform fmt -check -recursive

      - name: Terraform validate
        run: terraform validate

  conftest:
    name: Conftest (OPA)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Helm
        run: |
          curl -sSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" -o /tmp/helm.tar.gz
          tar -xzf /tmp/helm.tar.gz -C /tmp
          sudo mv /tmp/linux-amd64/helm /usr/local/bin/helm
          helm version --short

      - name: Install conftest
        run: |
          curl -sSL -o /tmp/conftest.tar.gz "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz"
          tar -xzf /tmp/conftest.tar.gz -C /tmp
          sudo mv /tmp/conftest /usr/local/bin/conftest
          conftest --version

      - name: Test base Kubernetes manifests
        run: conftest test cd/kubernetes/_base/ --policy policy/conftest/kubernetes --output table

      - name: Test rendered Helm output
        run: helm template webapp cd/helm/webapp/ | conftest test - --policy policy/conftest/kubernetes --output table

  catalog-validate:
    name: Catalog Validate
    runs-on: ubuntu-latest
    needs:
      - yamllint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate catalog
        run: |
          pip install --disable-pip-version-check --no-cache-dir pyyaml --quiet
          python catalog/scripts/validate-catalog.py --strict --skip-url-check

  handbook-build:
    name: Website / Handbook Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Build website or validate handbook
        shell: bash
        run: |
          set -euo pipefail

          if [ -d website ]; then
            echo "website/ exists: running npm ci && npm run build"
            cd website
            npm ci
            npm run build
            exit 0
          fi

          if [ -f handbook.html ]; then
            echo "handbook.html exists at repo root: validating"
            npm install --no-save html-validate@8.24.2
            npx html-validate handbook.html
            exit 0
          fi

          if [ -f docs/handbook.html ]; then
            echo "docs/handbook.html exists: validating"
            npm install --no-save html-validate@8.24.2
            npx html-validate docs/handbook.html
            exit 0
          fi

          echo "::warning::No website/ directory or handbook.html found. Skipping build checks."

  quality-gate:
    name: "✅ Repo Quality Gate"
    needs:
      - markdown-links
      - actionlint
      - yamllint
      - kubeconform
      - helm-lint
      - terraform
      - conftest
      - catalog-validate
      - handbook-build
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          results='${{ toJSON(needs) }}'
          if echo "$results" | grep -q '"result":"failure"'; then
            echo "❌ One or more quality gate checks failed."
            exit 1
          fi
          if echo "$results" | grep -q '"result":"cancelled"'; then
            echo "❌ One or more quality gate checks were cancelled."
            exit 1
          fi
          echo "✅ All quality gate checks passed."
