---
# ============================================================
# TEMPLATE: GitHub Actions — Microsoft Teams Notification (Reusable)
# WHEN TO USE: Any pipeline needing Teams success/failure alerts
# PREREQUISITES: Teams Incoming Webhook URL (Workflows connector)
# SECRETS NEEDED: webhook-url (Teams Incoming Webhook URL)
# WHAT TO CHANGE: Adaptive Card layout if needed
# RELATED FILES: notifications/slack-notify.yml
# MATURITY: Stable
# ============================================================

name: Microsoft Teams Notification Template

on:
  workflow_call:
    inputs:
      status:
        required: true
        type: string
      message:
        required: false
        type: string
        default: ""
    secrets:
      webhook-url:
        required: true

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Teams Notification (Adaptive Card)
        run: |
          STATUS="$STATUS"
          if [ "$STATUS" = "success" ]; then
            ICON="✅"
            COLOR="good"
          else
            ICON="❌"
            COLOR="attention"
          fi

          jq -n \
            --arg icon "$ICON" --arg status "$STATUS" --arg color "$COLOR" \
            --arg repository "$REPOSITORY" --arg branch "$BRANCH" --arg commit "$COMMIT" --arg url "$RUN_URL" \
            '{type:"message",attachments:[{contentType:"application/vnd.microsoft.card.adaptive",content:{"$schema":"http://adaptivecards.io/schemas/adaptive-card.json",type:"AdaptiveCard",version:"1.4",body:[{type:"TextBlock",size:"medium",weight:"bolder",color:$color,text:($icon + " Pipeline " + $status)},{type:"FactSet",facts:[{title:"Repository",value:$repository},{title:"Branch",value:$branch},{title:"Commit",value:$commit}]}],actions:[{type:"Action.OpenUrl",title:"View Run",url:$url}]}}]}' \
            | curl --fail-with-body -H "Content-Type: application/json" --data-binary @- "$WEBHOOK_URL"
        env:
          STATUS: ${{ inputs.status }}
          WEBHOOK_URL: ${{ secrets.webhook-url }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
