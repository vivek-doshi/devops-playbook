    description: "Defines least-privilege responsibilities through RBAC and policy enforcement."
    status: implemented
    evidence:
      - type: kubernetes-config
        path: cd/kubernetes/_base/rbac/
        description: "Role and role binding templates for scoped access."
      - type: kyverno-policy
        path: policy/kyverno/require-non-root.yaml
        description: "Restricts elevated execution by default."
    automated_checks:
      - name: cis-rbac-enabled
        tool: kube-bench
        cis_id: "5.1.1"
        command: "kube-bench run --targets=policies --json"
        pass_condition: "PASS"
