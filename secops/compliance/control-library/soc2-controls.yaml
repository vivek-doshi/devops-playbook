        pass_condition: "PASS"
      - name: signed-image-gate
        tool: kubectl
        command: "kubectl get clusterpolicy verify-image-signature -o json"
        pass_condition: ".metadata.name == \"verify-image-signature\""
    audit_query: |
      {source="k8s-audit", resource="deployments"} | json | verb=~"create|update|patch"

  - id: C1.1
    title: "Identification and maintenance of confidential information"
