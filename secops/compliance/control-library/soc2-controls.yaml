    status: implemented
    evidence:
      - type: runbook
        path: secops/runbooks/compromised-pod.md
        description: "Evaluation and triage procedure for compromised workloads."
      - type: runbook
        path: secops/runbooks/secret-exposure.md
        description: "Secret exposure triage and impact analysis."
    automated_checks:
      - name: runbook-files-exist
        tool: kubectl
        command: "kubectl version --client"
        pass_condition: "command-succeeds"
      - name: policyreport-health
        tool: kubectl
        command: "kubectl get policyreport -A -o json"
        pass_condition: ".items | length >= 0"
    audit_query: |
      {source="k8s-audit", resource="events"} | json | reason=~"Warning|Failed"

  - id: CC7.4
    title: "Incident response"
    description: "Executes documented containment, remediation, and post-incident response procedures."
    status: implemented
    evidence:
      - type: runbook
        path: secops/runbooks/supply-chain-incident.md
        description: "Supply chain incident response execution path."
      - type: runbook
        path: secops/runbooks/node-compromise.md
        description: "Node-level compromise response and evidence handling."
    automated_checks:
      - name: alerts-routing
        tool: kubectl
        command: "kubectl get secret -n monitoring -o json"
        pass_condition: ".items | length >= 0"
      - name: policy-violations-visible
        tool: kubectl
        command: "kubectl get policyreport -A -o json"
        pass_condition: ".items | length >= 0"
    audit_query: |
      {source="k8s-audit", resource="pods"} | json | responseStatus.code>=400

  - id: CC8.1
    title: "Infrastructure change control"
    description: "Applies auditable change controls and supply chain checks before infrastructure updates."
