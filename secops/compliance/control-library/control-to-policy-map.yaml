# ============================================================
# TEMPLATE: Compliance Crosswalk - Control To Policy Map
# WHEN TO USE: Authoritative mapping for secops.requirements annotations
# PREREQUISITES: policy/kyverno and secops/supply-chain policy inventory
# SECRETS NEEDED: None
# WHAT TO CHANGE: Framework control references per policy
# RELATED FILES: secops/supply-chain/cosign-verify-policy.yaml
# MATURITY: Beta
# ============================================================

version: 1
policies:
  - path: policy/kyverno/disallow-latest-tag.yaml
    name: disallow-latest-tag
    satisfies:
      - framework: SOC2
        controls: ["CC6.1", "CC8.1"]
      - framework: CIS-Kubernetes
        controls: ["5.5.1"]
      - framework: ISO27001
        controls: ["5.10", "8.28"]

  - path: policy/kyverno/enforce-finops-labels.yaml
    name: enforce-finops-labels
    satisfies:
      - framework: SOC2
        controls: ["CC8.1"]
      - framework: CIS-Kubernetes
        controls: ["5.7.1"]
      - framework: ISO27001
        controls: ["5.12", "8.9"]

  - path: policy/kyverno/require-labels.yaml
    name: require-labels
    satisfies:
      - framework: SOC2
        controls: ["CC8.1"]
      - framework: CIS-Kubernetes
        controls: ["5.7.1"]
      - framework: ISO27001
        controls: ["5.12", "8.9"]

  - path: policy/kyverno/require-liveness-readiness.yaml
