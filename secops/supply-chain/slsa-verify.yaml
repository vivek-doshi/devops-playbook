# SLSA verification uses the same namespace-controlled rollout as signatures.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verify-slsa-provenance
  annotations:
    policies.kyverno.io/title: Verify SLSA Provenance
    policies.kyverno.io/category: Supply Chain Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/minversion: "1.10.0"
spec:
  validationFailureAction: Audit
  validationFailureActionOverrides:
    - action: Enforce
      namespaceSelector:
        matchLabels:
          policy.kyverno.io/slsa: enforce
  background: false
  webhookTimeoutSeconds: 30
  rules:
    - name: verify-slsa-provenance
      match:
        any:
          - resources:
              kinds: [Pod]
              operations: [CREATE, UPDATE]
      exclude:
        any:
          - resources:
              namespaces: [kube-system, kube-public, kube-node-lease, kyverno]
      context:
        - name: namespaceLabels
          apiCall:
            urlPath: "/api/v1/namespaces/{{request.namespace}}"
            jmesPath: "metadata.labels"
      preconditions:
        all:
          - key: "{{ namespaceLabels.\"policy.kyverno.io/slsa\" || '' }}"
            operator: NotEquals
            value: disabled
      verifyImages:
        - imageReferences: ["*"]
          skipImageReferences: ["registry.k8s.io/*", "k8s.gcr.io/*", "docker.io/library/nginx:*", "docker.io/library/redis:*", "docker.io/library/postgres:*", "docker.io/library/busybox:*"]
          attestations:
            - predicateType: "https://slsa.dev/provenance/v0.2"
              conditions:
                - all:
                    - key: "{{ attestation.predicate.builder.id }}"
                      operator: Like
                      value: "https://github.com/*/.github/workflows/*@*"
              attestors:
                - count: 1
                  entries:
                    - keyless:
                        subject: "https://github.com/slsa-framework/slsa-github-generator/.github/workflows/*@*"
                        issuer: "https://token.actions.githubusercontent.com"
                        rekor:
                          url: "https://rekor.sigstore.dev"
          mutateDigest: false
          verifyDigest: true
