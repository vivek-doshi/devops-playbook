# Signature verification is audit-only until a namespace owner opts in.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verify-image-signature
  annotations:
    policies.kyverno.io/title: Verify Image Signature
    policies.kyverno.io/category: Supply Chain Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/minversion: "1.10.0"
spec:
  validationFailureAction: Audit
  validationFailureActionOverrides:
    - action: Enforce
      namespaceSelector:
        matchLabels:
          policy.kyverno.io/supply-chain: enforce
  background: false
  webhookTimeoutSeconds: 30
  rules:
    - name: verify-image-signature
      match:
        any:
          - resources:
              kinds: [Pod]
              operations: [CREATE, UPDATE]
      exclude:
        any:
          - resources:
              namespaces: [kube-system, kube-public, kube-node-lease, kyverno]
      context:
        - name: namespaceLabels
          apiCall:
            urlPath: "/api/v1/namespaces/{{request.namespace}}"
            jmesPath: "metadata.labels"
      preconditions:
        all:
          - key: "{{ namespaceLabels.\"policy.kyverno.io/supply-chain\" || '' }}"
            operator: NotEquals
            value: disabled
      verifyImages:
        - imageReferences: ["*"]
          skipImageReferences: ["registry.k8s.io/*", "k8s.gcr.io/*", "docker.io/library/nginx:*", "docker.io/library/redis:*", "docker.io/library/postgres:*", "docker.io/library/busybox:*"]
          attestors:
            - count: 1
              entries:
                - keyless:
                    subject: "https://github.com/*/.github/workflows/*@*"
                    issuer: "https://token.actions.githubusercontent.com"
                    rekor:
                      url: "https://rekor.sigstore.dev"
          mutateDigest: true
          verifyDigest: true
