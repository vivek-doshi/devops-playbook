# TEMPLATE: Helm Template — Microservice ServiceAccount
# WHEN TO USE: Creates a dedicated service account for the microservice workload.
# PREREQUISITES: serviceAccount.create enabled and RBAC policies planned.
# MATURITY: Stable
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "microservice.serviceAccountName" . }}
  labels:
    {{- include "microservice.labels" . | nindent 4 }}
{{- end }}
