# TEMPLATE: Helm Template — Webapp ServiceAccount
# WHEN TO USE: Creates a dedicated service account for the webapp workload.
# PREREQUISITES: serviceAccount.create enabled and RBAC policies planned.
# MATURITY: Stable
{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "webapp.serviceAccountName" . }}
  labels:
    {{- include "webapp.labels" . | nindent 4 }}
{{- end }}
