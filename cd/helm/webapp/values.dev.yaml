---
# TEMPLATE: Helm Values Override — Webapp Development
# WHEN TO USE: Development-only overrides for the webapp chart.
# PREREQUISITES: Base values in values.yaml and a dev namespace.
# SUPPORT: template
# MATURITY: Template
# Dev overrides
replicaCount: 1

image:
  tag: dev-latest

ingress:
  host: dev.app.example.com
  tls: false

resources:
  limits:
    memory: "256Mi"

autoscaling:
  enabled: false
