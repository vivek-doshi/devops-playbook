---
# ============================================================
# TEMPLATE: GitHub Actions — Deploy to GCP GKE
# WHEN TO USE: Deploying to Google Kubernetes Engine via Workload Identity
# PREREQUISITES: GKE cluster, Workload Identity Federation setup
# SECRETS NEEDED: WIF_PROVIDER, WIF_SERVICE_ACCOUNT
# WHAT TO CHANGE: Project ID, cluster name, zone
# RELATED FILES: cd/kubernetes/_overlays/prod/kustomization.yaml
# MATURITY: Stable
# ============================================================

name: Deploy to GCP GKE

on:
  push:
    branches: [main]

env:
  ARGOCD_APP_NAME: my-app
  HEALTHCHECK_URL: https://app.example.com/health/ready

concurrency:
  group: deploy-gcp-gke-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Wait for Argo CD reconciliation
        run: ./cd/gitops/argocd/wait-for-sync.sh
        env:
          ARGOCD_SERVER: ${{ vars.ARGOCD_SERVER }}
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_READ_TOKEN }}

      - name: Smoke test
        run: |
          for i in {1..12}; do
            if curl -fsS "$HEALTHCHECK_URL" >/dev/null; then
              echo "Smoke test passed"
              exit 0
            fi
            sleep 5
          done
          echo "Smoke test failed"
          exit 1

  notify-failure:
    if: ${{ failure() }}
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Notify Slack on deployment failure
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":x: *${{ github.repository }}* deployment *failed*\n*Target:* `gcp-gke`\n*Environment:* `production`"
                  }
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": { "type": "plain_text", "text": "View Run" },
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
