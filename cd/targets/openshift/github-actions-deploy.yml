---
# ============================================================
# TEMPLATE: GitHub Actions — Deploy to Red Hat OpenShift
# WHEN TO USE: Deploying to OpenShift via service account token
# PREREQUISITES: OpenShift cluster, service account with deploy permissions
# SECRETS NEEDED: OPENSHIFT_SERVER, OPENSHIFT_TOKEN
# WHAT TO CHANGE: Server URL, project/namespace, image, app name
# RELATED FILES: cd/kubernetes/_overlays/prod/kustomization.yaml
# MATURITY: Stable
# ============================================================

name: Deploy to OpenShift

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

env:
  ARGOCD_APP_NAME: my-app

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Wait for Argo CD reconciliation
        run: ./cd/gitops/argocd/wait-for-sync.sh
        env:
          ARGOCD_SERVER: ${{ vars.ARGOCD_SERVER }}
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_READ_TOKEN }}
