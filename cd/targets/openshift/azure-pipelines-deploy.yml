---
# ============================================================
# TEMPLATE: Azure Pipelines — Deploy to Red Hat OpenShift
# WHEN TO USE: OpenShift deployment from Azure DevOps pipelines
# PREREQUISITES: Argo CD is connected to the protected production Git branch
# SECRETS NEEDED: ARGOCD_SERVER, ARGOCD_READ_TOKEN
# WHAT TO CHANGE: Pipeline resource, environment name, project/namespace, app name
# RELATED FILES: cd/kubernetes/_overlays/prod/kustomization.yaml
# SUPPORT: template
# MATURITY: Template
# ============================================================

# Azure Pipelines — Deploy to OpenShift
trigger: none  # Triggered by CD pipeline, not directly

resources:
  pipelines:
    - pipeline: ci-build
      source: CI-Build-Pipeline
      trigger:
        branches:
          include: [main]

stages:
  - stage: Deploy
    jobs:
      - deployment: DeployOpenShift
        environment: production
        strategy:
          runOnce:
            deploy:
              steps:
                - script: |
                    docker run --rm -e ARGOCD_AUTH_TOKEN=$(ARGOCD_READ_TOKEN) quay.io/argoproj/argocd:v2.12.3 \
                      app wait "$(ARGOCD_APP_NAME)" --server "$(ARGOCD_SERVER)" --grpc-web --sync --health --timeout 300
                  displayName: Wait for Argo CD reconciliation
