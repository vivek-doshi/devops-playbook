---
# ============================================================
# TEMPLATE: GitLab CI — Deploy to AWS EKS
# WHEN TO USE: Deploying to EKS from GitLab CI/CD
# PREREQUISITES: Argo CD is connected to the protected production Git branch
# SECRETS NEEDED: ARGOCD_SERVER, ARGOCD_READ_TOKEN
# WHAT TO CHANGE: Cluster name, region, overlay path
# RELATED FILES: cd/kubernetes/_overlays/prod/kustomization.yaml
# MATURITY: Stable
# ============================================================

# GitLab CI — Deploy to AWS EKS
deploy-eks:
  stage: deploy
  image: quay.io/argoproj/argocd:v2.12.3
  script:
    - argocd app wait "$ARGOCD_APP_NAME" --server "$ARGOCD_SERVER" --auth-token "$ARGOCD_READ_TOKEN" --grpc-web --sync --health --timeout 300
  environment:
    name: production
    url: https://app.example.com
  only:
    - production
