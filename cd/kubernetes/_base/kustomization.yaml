---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - hpa.yaml
  - configmap.yaml
  # evicted at once during node drains and cluster upgrades. Required for HA.
  # Overlays can patch spec.minAvailable for environment-specific thresholds.
  - pdb.yaml
  # Composable policy and RBAC packages are the canonical source. They keep
  # each concern independently reviewable and reusable by overlays.
  - network-policies
  - rbac
  # Do NOT switch to Auto/Recreate mode if hpa.yaml uses CPU/memory targets —
  # see the warning comment inside vpa.yaml for the full explanation.
  - vpa.yaml

commonLabels:
  managed-by: kustomize
