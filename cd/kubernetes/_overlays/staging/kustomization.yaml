---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../_base

namespace: staging

commonLabels:
  finops.org/environment: staging

patches:
  - patch: |-
      - op: replace
        path: /metadata/annotations/cert-manager.io~1cluster-issuer
        value: letsencrypt-staging
    target:
      kind: Ingress
      name: app

images:
  - name: my-registry/my-app
    newTag: v1.0.0-staging
