---
# TEMPLATE: Pulumi Stack Config — AWS Development
# WHEN TO USE: Development configuration for AWS app-layer Pulumi deployment.
# PREREQUISITES: Pulumi stack initialized and non-production secrets configured with pulumi config set --secret.
# MATURITY: Stable
config:
  aws:region: us-east-1
  aws-ecs-fargate:containerPort: "3000"
  aws-ecs-fargate:cpu: "256"
  aws-ecs-fargate:memory: "512"
  aws-ecs-fargate:desiredCount: "1"
  aws-ecs-fargate:imageName: "my-org/my-app:1.0.0-dev"
