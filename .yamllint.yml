---
extends: default
rules:
  line-length: disable
  truthy:
    allowed-values: ["true", "false", "on", "off", "yes", "no"]
    check-keys: false
  comments:
    min-spaces-from-content: 1
  comments-indentation: disable
  document-start: disable
  colons: disable
  braces:
    max-spaces-inside: 1
  brackets:
    max-spaces-inside: 1
  new-lines:
    type: unix
ignore: |
  docs/diagrams/
  .devcontainer/
  node_modules/
  .git/
  tmp/
  cd/helm/*/templates/
