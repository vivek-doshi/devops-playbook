---
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4

containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry.mirrors."localhost:5001"]
      endpoint = ["http://kind-registry:5000"]

nodes:
  - role: control-plane
    image: kindest/node:v1.31.0 # Keep aligned with versions.yaml.
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
    extraMounts:
      - hostPath: ./local-dev/kind/registry
        containerPath: /var/local-registry
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            system-reserved: cpu=250m,memory=512Mi
            kube-reserved: cpu=250m,memory=512Mi
  - role: worker
    image: kindest/node:v1.31.0 # Keep aligned with versions.yaml.
    extraMounts:
      - hostPath: ./local-dev/kind/registry
        containerPath: /var/local-registry
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            system-reserved: cpu=250m,memory=512Mi
            kube-reserved: cpu=250m,memory=512Mi
  - role: worker
    image: kindest/node:v1.31.0 # Keep aligned with versions.yaml.
    extraMounts:
      - hostPath: ./local-dev/kind/registry
        containerPath: /var/local-registry
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            system-reserved: cpu=250m,memory=512Mi
            kube-reserved: cpu=250m,memory=512Mi
