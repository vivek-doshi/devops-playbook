---
apiVersion: catalog/v1
kind: Service
metadata:
  name: app
  owner: platform-team
  display_name: "Core App"
  description: "Baseline Kubernetes deployment template used for core application delivery examples."
  lifecycle: stable

spec:
  contact: platform-team@example.com
  oncall:
    pagerduty_service: PPLAT01
    slack_channel: "#platform-alerts"

  namespaces:
    - production/app
    - staging/app
    - dev/app

  image: ghcr.io/example-org/app

  dependencies:
    - type: service
      name: api-gateway

  slo:
    availability_target: 99.9
    latency_target_ms: 500
    definition_file: observability/prometheus/slos/my-service-availability-slo.yaml

  runbook_url: https://kubernetes.io/docs/concepts/overview/
  docs_url: https://confluence.example.com/platform/app

  cost_center: engineering
  environment: production

  data_classification: confidential
  compliance_frameworks:
    - SOC2
    - ISO27001
