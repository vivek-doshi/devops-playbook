apiVersion: catalog/v1
kind: Service
metadata:
  name: api-gateway
  owner: platform-team
  display_name: "API Gateway"
  description: "Routes inbound API traffic, enforces auth policy, and forwards requests to internal services."
  lifecycle: stable

spec:
  contact: platform-team@example.com
  oncall:
    pagerduty_service: PPLAT01
    slack_channel: "#platform-alerts"

  namespaces:
    - production/api-gateway
    - staging/api-gateway
    - dev/api-gateway

  image: ghcr.io/example-org/api-gateway

  dependencies:
    - type: service
      name: auth-service
    - type: database
      name: gateway-config-postgres
      cloud: aws
      region: us-east-1
    - type: external-api
      name: stripe
      url: https://api.stripe.com

  slo:
    availability_target: 99.9
    latency_target_ms: 500
    definition_file: observability/prometheus/slos/my-service-availability-slo.yaml

  runbook_url: https://github.com/example-org/cicd-reference/blob/main/docs/runbooks/slo-breach-response.md
  docs_url: https://confluence.example.com/platform/api-gateway

  cost_center: engineering
  environment: production

  data_classification: confidential
  compliance_frameworks:
    - SOC2
    - ISO27001
